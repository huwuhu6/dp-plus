server:
  tomcat:
    max-connections: 1000
    threads:
      max: 800
  port: 8081
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    database: ${REDIS_DATABASE}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  ai:
    mcp:
      client:
        enabled: ${AI_LOCATION_MCP_ENABLED:false}
        type: SYNC
        request-timeout: ${AI_LOCATION_MCP_TIMEOUT:6s}
        toolcallback:
          enabled: false
        sse:
          connections:
            amap:
              url: ${AI_LOCATION_MCP_URL:http://127.0.0.1:8000}
              sse-endpoint: /sse
    vectorstore:
      # Keep the vector store disabled unless the local Milvus container and embedding credentials are configured.
      type: ${AI_VECTOR_STORE_TYPE:none}
      milvus:
        collection-name: ${AI_MILVUS_COLLECTION:hmdp_shop_evidence}
        embedding-dimension: ${AI_EMBEDDING_DIMENSION:1536}
        initialize-schema: ${AI_MILVUS_INITIALIZE_SCHEMA:true}
        auto-id: false
        client:
          host: ${AI_MILVUS_HOST:127.0.0.1}
          port: ${AI_MILVUS_PORT:19530}
          connect-timeout-ms: ${AI_MILVUS_CONNECT_TIMEOUT_MS:3000}
    openai:
      base-url: ${AI_EMBEDDING_BASE_URL:${ai.base-url}}
      api-key: ${AI_EMBEDDING_API_KEY:${ai.api-key}}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: info
ai:
  location:
    mcp:
      enabled: ${AI_LOCATION_MCP_ENABLED:false}
      tool-timeout-ms: ${AI_LOCATION_MCP_TOOL_TIMEOUT_MS:800}
  provider: ${AI_PROVIDER:dashscope}
  base-url: ${AI_BASE_URL:${DASHSCOPE_COMPATIBLE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
  api-key: ${AI_API_KEY:${DASHSCOPE_API_KEY:}}
  model: ${AI_MODEL:deepseek-v4-flash}
  timeout-ms: ${AI_TIMEOUT_MS:20000}
  tool-planning-timeout-ms: ${AI_TOOL_PLANNING_TIMEOUT_MS:8000}
  tool-execution-timeout-ms: ${AI_TOOL_EXECUTION_TIMEOUT_MS:2500}
  answer-polish-timeout-ms: ${AI_ANSWER_POLISH_TIMEOUT_MS:8000}
  result-evaluation:
    auto-expand-default-nearby-radius: ${AI_RESULT_EVALUATION_AUTO_EXPAND_DEFAULT_NEARBY_RADIUS:true}
    auto-expanded-nearby-radius-km: ${AI_RESULT_EVALUATION_AUTO_EXPANDED_NEARBY_RADIUS_KM:5}
  query-rewrite:
    enabled: ${AI_QUERY_REWRITE_ENABLED:true}
    provider: ${AI_QUERY_REWRITE_PROVIDER:dashscope}
    base-url: ${AI_QUERY_REWRITE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${AI_QUERY_REWRITE_MODEL:qwen-flash}
    timeout-ms: ${AI_QUERY_REWRITE_TIMEOUT_MS:8000}
  narrative-enabled: ${AI_NARRATIVE_ENABLED:true}
  retrieval:
    vector-enabled: ${AI_RETRIEVAL_VECTOR_ENABLED:false}
    semantic-weight: ${AI_RETRIEVAL_SEMANTIC_WEIGHT:18}
    semantic-top-k: ${AI_RETRIEVAL_SEMANTIC_TOP_K:80}
    semantic-min-score: ${AI_RETRIEVAL_SEMANTIC_MIN_SCORE:0.35}
  retrieval-strategy-version: structured-profile-evidence-vector-v3
  evaluation-dataset-version: seed-v2
  holdout-dataset-version: holdout-v1
