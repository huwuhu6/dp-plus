server:
  tomcat:
    max-connections: 1000
    threads:
      max: 800
  port: 8081
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    database: ${REDIS_DATABASE}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: info
ai:
  provider: ${AI_PROVIDER}
  base-url: ${AI_BASE_URL}
  api-key: ${DEEPSEEK_API_KEY}
  model: ${AI_MODEL}
  timeout-ms: ${AI_TIMEOUT_MS:20000}
  tool-planning-timeout-ms: ${AI_TOOL_PLANNING_TIMEOUT_MS:8000}
  answer-polish-timeout-ms: ${AI_ANSWER_POLISH_TIMEOUT_MS:8000}
  narrative-enabled: ${AI_NARRATIVE_ENABLED:true}
  retrieval-strategy-version: structured-profile-evidence-v2
  evaluation-dataset-version: seed-v2
  holdout-dataset-version: holdout-v1
